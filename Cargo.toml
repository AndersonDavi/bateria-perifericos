[package]
name = "bateria-perifericos"
version = "0.2.3"
edition = "2021"
description = "Batería de mouse, audífonos y mandos inalámbricos en la bandeja de Windows, sin las apps de cada marca"
license = "MIT"

[dependencies]
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
tray-icon = { version = "0.26", default-features = false }
resvg = { version = "0.49", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Gaming_Input",
    "Devices_Power",
    "System_Power",
    "Foundation",
    "Foundation_Collections",
    "Win32_System_WinRT",
    "Win32_UI_Input_XboxController",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
